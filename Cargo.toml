[package]
name = "unkn0wntorrent"
version = "0.1.0"
edition = "2021"
description = "Unkn0WnTorrent - быстрый торрент-клиент с упором на максимальную скорость"
license = "MIT"
repository = "https://github.com/Unkn0Wms1337/Unkn0WnTorrent"
homepage = "https://github.com/Unkn0Wms1337/Unkn0WnTorrent"
readme = "README.md"

[[bin]]
name = "Unkn0WnTorrent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
fs2 = "0.4"
librqbit = { version = "9.1", default-features = false, features = ["default-tls"] }
rfd = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
winresource = "0.1"
